name: Auto update Next.js / React (daily)

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with sync-catalog.yml: only one maintenance job may write the default branch.
  group: maintenance-default-branch
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.13'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Update deps
        # Keep the committed text lockfile format stable.
        run: bun add --save-text-lockfile next@latest react@latest react-dom@latest

      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build with Node.js
        run: bun run build

      - name: Commit validated dependency files
        shell: bash
        run: |
          set -euo pipefail

          # Fail if installation or validation changed anything outside the tested update.
          while IFS= read -r -d '' record; do
            case "${record:3}" in
              package.json|bun.lock) ;;
              *) echo '::error::Unexpected file changes outside package.json and bun.lock.'; exit 1 ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all -z)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json bun.lock
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "chore(deps): bump next/react/react-dom to latest"
          # A concurrent human update must reject this push. Never pull, rebase, or
          # force-push a tree that differs from the one validated above.
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
